name: Build and push image

# Proposed workflow, not active: it lives under DOT-GITHUB-UPDATED/ so a human can review it,
# then move it to .github/workflows/. It builds the shaded JAR and publishes the container image
# to the GitHub Container Registry at ghcr.io/sensepitch/sensepitch-edge, the repository the Helm
# chart defaults to (charts/sensepitch-edge/values.yaml).
#
# main is tagged 0.2-SNAPSHOT (the chart's appVersion; keep it in sync with pom.xml <version>
# and the chart) and latest. A v* release tag is tagged with its semver.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # The full gate before the image is built: unit and integration tests, Spotless, the Javadoc
    # build and the JaCoCo coverage floor. The image build itself skips tests on purpose.
    - name: Build, test and check
      run: ./mvnw clean verify

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/sensepitch/sensepitch-edge
        tags: |
          type=raw,value=0.2-SNAPSHOT,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # persist layers and the Maven cache mount between runs
        cache-from: type=gha
        cache-to: type=gha,mode=max
