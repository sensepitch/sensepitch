name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push cancels the run of the previous one on the same branch or pull request, so a series
# of pushes builds only the last. GitHub-hosted runners are free for public repositories.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [25]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build, test and check
      run: ./mvnw clean verify
      
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: sensepitch-edge-with-dependencies.jar
        path: target/sensepitch-edge-*-with-dependencies.jar
        retention-days: 7
        
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/reports/apidocs/
        retention-days: 7
