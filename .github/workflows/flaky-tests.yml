name: Flaky tests

# Runs the full gate many times on the same commit to find flaky tests, several runs at the same
# time to overload the CPU, which makes timing dependent tests fail more often
# (`.github/scripts/flaky_runs.sh`). A test that fails in some runs and passes in others is flaky;
# the report in the run summary lists each failed test with the number of runs it failed in, and
# an overview per run. The job fails if any test
# failed, so GitHub notifies. The reports and logs of every run are kept as an artifact.
on:
  schedule:
    # 20:27 Singapore time (UTC+8, no daylight saving time) is 12:27 UTC; GitHub cron runs in
    # UTC, and GitHub may start a scheduled run late
    - cron: '27 12 * * *'
  workflow_dispatch:
    inputs:
      parallel:
        description: 'Concurrent verify runs per round'
        default: '5'
      rounds:
        description: 'Number of rounds'
        default: '5'

# never two hunts at once, they would slow each other down and produce flakes of their own
concurrency:
  group: flaky-tests
  cancel-in-progress: false

permissions:
  contents: read

env:
  PARALLEL: ${{ github.event.inputs.parallel || '5' }}
  ROUNDS: ${{ github.event.inputs.rounds || '5' }}
  MAX_DELAY_SECONDS: '5'

jobs:
  hunt:
    runs-on: ubuntu-latest
    # about 80 s per verify run alone on the hosted runner (4 CPUs; measured 2026-11-21, 10 runs
    # in a row took 13 min), so 25 runs five at a time should take about 30 to 35 min; not
    # measured in parallel yet, more than double as margin
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # every run a complete `clean verify`, as in CI; a failed test does not stop the run, so the
    # integration tests run too, and a failed run does not stop the others
    - name: Verify runs
      run: .github/scripts/flaky_runs.sh flaky-runs

    # fails the job if a test failed in any run; the report file is written first
    - name: Report
      if: always()
      run: python3 .github/scripts/flaky_report.py flaky-runs flaky-runs/report.md

    - name: Summary
      if: always() && hashFiles('flaky-runs/report.md') != ''
      run: cat flaky-runs/report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload run reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: flaky-test-runs
        path: flaky-runs/
        retention-days: 14
