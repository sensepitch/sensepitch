name: Nightly

# The full gate plus the tests tagged "excessive" (-Dexcessive, see test.excludedGroups in
# pom.xml): measurements of the JVM rather than of our code, too load sensitive for every push.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Build, test and check, with the excessive tests
      run: ./mvnw clean verify -Dexcessive

    - name: Upload test reports
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nightly-test-reports
        path: |
          target/surefire-reports/
          target/failsafe-reports/
        retention-days: 7
